type: object
properties:
  name:
    type: string
    example: "John Doe"
  email:
    type: string
    format: email
    example: "john@example.com"
  phoneNumber:
    type: string
    example: "+380671234567"
  contactType:
    type: string
    example: work
  _id:
    type: string
    example: 67c4df1bbef969c92a2fc752
  userId:
    type: string
    example: 67c1ef559d2fd6cbeaa0ed6f
  isFavorite: 
    type: boolean
    example: true
  photo:
    type: string
    format: binary
    example: https://res.cloudinary.com/qwerty/image/upload/1234.jpg
required:

  - name
  - email
  - phoneNumber
