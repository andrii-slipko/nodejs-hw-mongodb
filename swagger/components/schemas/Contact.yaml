type: object
properties:
  name:
    type: string
    example: "John Doe"
  email:
    type: string
    format: email
    example: "john@example.com"
  phoneNumber:
    type: string
    example: "+380671234567"
  contactType:
    type: string
    example: work
  isFavorite: 
    type: boolean
    example: true
  Photo:
    type: string
    example: https://res.cloudinary.com/qwerty/image/upload/1234.jpg
required:

  - name
  - email
  - phoneNumber
