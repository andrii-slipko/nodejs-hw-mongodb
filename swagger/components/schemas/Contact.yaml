type: object
properties:
  _id:
    type: string
    example: "65c2e863f3a512b8a789b8d3"
  name:
    type: string
    example: "John Doe"
  email:
    type: string
    format: email
    example: "john@example.com"
  phone:
    type: string
    example: "+380671234567"
required:
  - _id
  - name
  - email
  - phone
