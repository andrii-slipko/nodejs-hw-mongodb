
  tags:
    - Contacts
  summary: Get contact by ID
  operationId: getContactById
  description: Get contact details by personal ID
  security:
    - bearerAuth: []
  parameters:
    - name: contactId
      in: path
      required: true
      description: personal ID of contact
      schema:
        type: string
  responses:
    "200":
      description: succes
      content:
        application/json:
          schema:
           type: object
           properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully found contact with id 67c1ef559d2fd6cbeaa0ed6f!!
              data:
                 $ref: "../../../components/schemas/Contact.yaml"
    "401":
      $ref: ../../../components/responses/401.yaml
    "404":
      $ref: ../../../components/responses/404.yaml
