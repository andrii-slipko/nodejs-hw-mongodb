
  tags:
    - Contacts
  summary: Update contact
  operationId: updateContact
  description: Update contact data by ID
  security:
    - bearerAuth: []
  parameters:
    - name: contactId
      in: path
      required: true
      description: contact ID for update
      schema:
        type: string
  requestBody:
    required: true
    content:
      multipart/formdata:
        schema:
          type: object
          properties:
            name:
              type: string
              example: "John Doe"
            email:
              type: string
              example: "john@example.com"
            phoneNumber:
              type: string
              example: "+380671234567"
            contactType:
              type: string
              example: work
            isFavorite: 
              type: boolean
              example: true
            Photo:
              type: string
              example: https://res.cloudinary.com/qwerty/image/upload/1234.jpg
            
  responses:
    "200":
      description: success
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully updated contact!
              data:
                $ref: "../../../components/schemas/Contact.yaml"
    "400":
      $ref: ../../../components/responses/400.yaml
    "401":
      $ref: ../../../components/responses/401.yaml
    "404":
      $ref: ../../../components/responses/404.yaml
