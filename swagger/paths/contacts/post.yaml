
  tags:
    - Contacts
  summary: Add new contact
  operationId: createContact
  description: Add new contact to a list of user`s contacts
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      multipart/formdata:
        schema:
          type: object
          properties:
            name:
              type: string
              example: "John Doe"
            email:
              type: string
              example: "john@example.com"
            phoneNumber:
              type: string
              example: "+380671234567"
            contactType:
              type: string
              example: work
            isFavorite: 
              type: boolean
              example: true
            photo:
              type: string
              format: binary
              example: https://res.cloudinary.com/qwerty/image/upload/1234.jpg
  responses:
    "201":
      description: success
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 201
              message:
                type: string
                example: Successfully created a contact!
              data:
                $ref: "../../components/schemas/Contact.yaml"
    "400":
      $ref: ../../components/responses/400.yaml
    "401":
      $ref: ../../components/responses/401.yaml
