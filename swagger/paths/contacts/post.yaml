
  tags:
    - Contacts
  summary: Add new contact
  operationId: createContact
  description: Add new contact to a list of user`s contacts
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      multipart/formdata:
        schema:
          $ref: "../../components/schemas/Contact.yaml"
  responses:
    "201":
      description: success
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 201
              message:
                type: string
                example: Successfully created a contact!
              data:
                $ref: "../../components/schemas/Contact.yaml"
    "400":
      $ref: ../../components/responses/400.yaml
    "401":
      $ref: ../../components/responses/401.yaml
