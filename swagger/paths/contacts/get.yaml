
  tags:
    - Contacts
  summary: get all contacts
  operationId: getAllContacts
  description: Get a list of all contacts, added by user
  security:
    - bearerAuth: []
  parameters:
    - name: page
      in: query
      required: false
      description: Page number (pagination)
      schema:
        type: integer
        example: 1
    - name: perPage
      in: query
      required: false
      description: Contacts per page
      schema:
        type: integer
        example: 10
    - name: sortBy
      in: query
      required: false
      description: Sort filter
      schema:
        type: integer
        example: name 
    - name: sortOrder
      in: query
      required: false
      description: Order of sorting
      schema:
        type: integer
        example: asc
    - name: type
      in: query
      required: false
      description: filter by type
      schema:
        type: integer
        example: work
    - name: isFavorite
      in: query
      required: false
      description: filter favorite contact
      schema:
        type: boolean
        example: false
  responses:
    "200":
      description: success
      content:
        application/json:
          schema:
           type: object
           properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully found contacts!
              data:
                 $ref: "../../components/schemas/Contact.yaml"
    "401":
      $ref: ../../components/responses/401.yaml
    "404":
      $ref: ../../components/responses/404.yaml