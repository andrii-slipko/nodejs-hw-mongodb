
  tags:
    - Contacts
  summary: get all contacts
  operationId: getAllContacts
  description: Get a list of all contacts, added by user
  security:
    - bearerAuth: []
  parameters:
    - name: page
      in: query
      required: false
      description: Page number (pagination)
      schema:
        type: integer
        example: 1
    - name: perPage
      in: query
      required: false
      description: Contacts per page
      schema:
        type: integer
        example: 10
    - name: totalItems
      in: query
      required: false
      description: Number of total contacts
      schema:
        type: integer
        example: 7 
    - name: totalPages
      in: query
      required: false
      description: Number of total pages
      schema:
        type: integer
        example: 2
    - name: hasPreviousPage
      in: query
      required: false
      description: existence of previous page
      schema:
        type: boolean
        example: true
    - name: hasNextPage
      in: query
      required: false
      description: existence of next page
      schema:
        type: boolean
        example: false
  responses:
    "200":
      description: success
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../components/schemas/Contact.yaml"
    "401":
      $ref: ../../components/responses/401.yaml
