
  tags:
    - Contacts
  summary: get all contacts
  operationId: getAllContacts
  description: Get a list of all contacts, added by user
  security:
    - bearerAuth: []
  parameters:
    - name: page
      in: query
      required: false
      description: Page number (pagination)
      schema:
        type: integer
        example: 1
    - name: limit
      in: query
      required: false
      description: Contacts per page
      schema:
        type: integer
        example: 10
    - name: favorite
      in: query
      required: false
      description: Filter favorite/not favorite contact
      schema:
        type: boolean
        example: true
  responses:
    "200":
      description: success
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../components/schemas/Contact.yaml"
    "401":
      description: Unauthorized user
